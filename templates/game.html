<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alphabet Matching Game</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
</head>
<body>
    <div id="reconnect-overlay" class="hidden">
        <div class="spinner"></div>
        <h2>Connection Lost</h2>
        <p>Hang tight! We're getting you back into the match...</p>
    </div>

    <div class="container">
        <h1>Alphabet Matching Game</h1>
        
        <div class="game-info">
            <div class="info-pill">
                <strong>Room Code:</strong> <span id="room-code">{{ room }}</span>
            </div>
            <div class="info-pill turn-highlight">
                <strong>Current Turn:</strong> <span id="current-turn">Waiting...</span>
            </div>
        </div>
        
        <div class="game-board">
            <div id="game-message" class="status-banner">Preparing deck...</div>

            <div class="hand-container">
                <h3>Your Hand</h3>
                <div id="player-hand" class="cards">
                    </div>
            </div>
            
            <div class="action-container">
                <p class="hint-text">💡 Tip: Collect 4 matching letters to win!</p>
            </div>
        </div>
        
        <div id="game-over" class="hidden">
            <div class="trophy-icon">🏆</div>
            <h2>Final Rankings</h2>
            <div id="rankings"></div>
            <a href="/" class="btn primary-btn">Play Again</a>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
    <script>
        // Start the engine
        initGame("{{ room }}", "{{ session['name'] }}");
    </script>
</body>
</html>
